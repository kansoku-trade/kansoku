packages:
  - packages/canvas-sdk
  - packages/core
  - packages/bench
  - packages/bench-report-ui
  - packages/build-overlay
  - packages/pro-api
  - packages/shared
  - apps/license-worker
  - apps/pro
  - apps/server
  - apps/site
  - apps/video
  - apps/web
  - apps/desktop
autoInstallPeers: false
ignoredOptionalDependencies:
  - esbuild
  - tsx
allowBuilds:
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/linux-x64': true
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/linux-x64': true
  '@google/genai': false
  '@revideo/telemetry': false
  # Electron's postinstall downloads the binary; blocking it defers the download
  # to the first require('electron'), and parallel vitest workers then race the
  # same dist/ extraction (proven flaky-fatal in CI: locales/fa.pak collision).
  electron: true
  electron-sparkle-updater: true
  esbuild: true
  protobufjs: false
  puppeteer: true
  sharp: true
  unrs-resolver: false
  workerd: true
overrides:
  'brace-expansion@^5.0.0': ^5.0.8
  fast-uri: ^3.1.4
  sharp: ^0.35.0
  shell-quote: ^1.9.0
minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai@0.80.6 || 0.84.1'
  - '@earendil-works/pi-agent-core@0.80.6 || 0.84.1'
  - '@innei/message-engine@0.2.0 || 0.4.0'
  - tsdown@0.22.5
  - electron-sparkle-updater@0.1.0
  - astro@7.1.3
  - marked@18.0.7
  - '@vibeloft/telemetry-electron@0.1.0'
patchedDependencies:
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
